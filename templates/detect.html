<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PPE Detection Interface</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }
        .container {
            display: flex;
            height: 100vh;
            width: 100vw;
        }
        .camera-section {
            flex: 0 0 66.66%;
            background: #000;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        .camera-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: hidden;
        }
        #videoStream {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .camera-controls {
            padding: 15px;
            background: #2a2a2a;
            display: flex;
            gap: 10px;
            justify-content: center;
        }
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        .btn-start {
            background: #28a745;
            color: white;
        }
        .btn-start:hover {
            background: #218838;
        }
        .btn-stop {
            background: #dc3545;
            color: white;
        }
        .btn-stop:hover {
            background: #c82333;
        }
        .status-section {
            flex: 0 0 33.33%;
            background: #2a2a2a;
            padding: 30px;
            overflow-y: auto;
        }
        .status-header {
            margin-bottom: 30px;
            text-align: center;
        }
        .status-header h2 {
            color: #fff;
            margin-bottom: 10px;
        }
        .compliance-status {
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            text-align: center;
        }
        .status-pass {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        .status-fail {
            background: #f8d7da;
            color: #721c24;
            border: 2px solid #dc3545;
        }
        .status-message {
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .status-icon {
            font-size: 48px;
            margin-bottom: 10px;
        }
        .items-list {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 20px;
        }
        .items-list h3 {
            margin-bottom: 20px;
            color: #fff;
            text-align: center;
        }
        .item {
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .item-present {
            background: #d4edda;
            color: #155724;
        }
        .item-missing {
            background: #f8d7da;
            color: #721c24;
        }
        .item-name {
            font-size: 16px;
            font-weight: bold;
        }
        .item-status {
            font-size: 24px;
        }
        .no-items {
            text-align: center;
            color: #999;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="camera-section">
            <div class="camera-container">
                <img id="videoStream" src="/video_feed" alt="Camera Feed">
            </div>
            <div class="camera-controls">
                <button class="btn btn-start" onclick="startDetection()">Start Detection</button>
                <button class="btn btn-stop" onclick="stopDetection()">Stop Detection</button>
            </div>
        </div>
        
        <div class="status-section">
            <div class="status-header">
                <h2>Safety Equipment Status</h2>
            </div>
            
            <div id="complianceStatus" class="compliance-status" style="display: none;">
                <div class="status-icon" id="statusIcon"></div>
                <div class="status-message" id="statusMessage"></div>
            </div>
            
            <div class="items-list">
                <h3>Equipment Status</h3>
                <div id="itemsList">
                    <div class="no-items">Start detection to see equipment status</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const safetyItems = ['Hard Hat', 'Safety Vest', 'Safety Gloves', 'Safety Glasses'];
        
        function startDetection() {
            fetch('/start_detection')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        updateStatus();
                    }
                });
        }

        function stopDetection() {
            fetch('/stop_detection')
                .then(response => response.json())
                .then(data => {
                    if (data.success) {
                        // Clear display immediately
                        document.getElementById('complianceStatus').style.display = 'none';
                        document.getElementById('itemsList').innerHTML = '<div class="no-items">Detection stopped</div>';
                    }
                });
        }

        function updateStatus() {
            fetch('/get_detection_status')
                .then(response => response.json())
                .then(data => {
                    if (data.message) {
                        return;
                    }
                    
                    const isCompliant = data.is_compliant || false;
                    const presentItems = data.present_items || [];
                    const missingItems = data.missing_items || [];
                    
                    // Update compliance status
                    const statusDiv = document.getElementById('complianceStatus');
                    statusDiv.style.display = 'block';
                    
                    if (isCompliant) {
                        statusDiv.className = 'compliance-status status-pass';
                        document.getElementById('statusIcon').textContent = '✓';
                        document.getElementById('statusMessage').textContent = 'You can enter to field';
                    } else {
                        statusDiv.className = 'compliance-status status-fail';
                        document.getElementById('statusIcon').textContent = '✗';
                        document.getElementById('statusMessage').textContent = 'Wear required equipment';
                    }
                    
                    // Update items list
                    let itemsHTML = '';
                    const allItems = [...presentItems, ...missingItems];
                    
                    // Show missing items first
                    missingItems.forEach(item => {
                        itemsHTML += `
                            <div class="item item-missing">
                                <span class="item-name">${item.name}</span>
                                <span class="item-status">✗</span>
                            </div>
                        `;
                    });
                    
                    // Then show present items
                    presentItems.forEach(item => {
                        itemsHTML += `
                            <div class="item item-present">
                                <span class="item-name">${item.name}</span>
                                <span class="item-status">✓</span>
                            </div>
                        `;
                    });
                    
                    if (itemsHTML === '') {
                        itemsHTML = '<div class="no-items">No items detected</div>';
                    }
                    
                    document.getElementById('itemsList').innerHTML = itemsHTML;
                });
        }

        // Update status every 1 second
        setInterval(updateStatus, 1000);
    </script>
</body>
</html>
